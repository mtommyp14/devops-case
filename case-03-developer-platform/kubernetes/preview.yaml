apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview
  labels:
    app.kubernetes.io/part-of: developer-platform-preview
    portfolio.example.com/pull-request: "42"
    portfolio.example.com/generation: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: preview
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preview
        app.kubernetes.io/part-of: developer-platform-preview
        portfolio.example.com/pull-request: "42"
        portfolio.example.com/generation: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: case-03-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PR_NUMBER
              value: "42"
            - name: GENERATION
              value: "1"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: case-03-demo-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: postgresql://preview:$(POSTGRES_PASSWORD)@postgres:5432/preview
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: preview
  labels:
    app.kubernetes.io/part-of: developer-platform-preview
    portfolio.example.com/pull-request: "42"
    portfolio.example.com/generation: "1"
spec:
  selector:
    app.kubernetes.io/name: preview
  ports:
    - name: http
      port: 8000
      targetPort: http
