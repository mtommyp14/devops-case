apiVersion: batch/v1
kind: Job
metadata:
  name: preview-seed
  labels:
    app.kubernetes.io/part-of: developer-platform-preview
    portfolio.example.com/pull-request: "42"
    portfolio.example.com/generation: "1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preview-seed
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: case-03-app:local
          imagePullPolicy: IfNotPresent
          command: ["python", "seed.py"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: case-03-demo-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: postgresql://preview:$(POSTGRES_PASSWORD)@postgres:5432/preview
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
