global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: router
    static_configs:
      - targets: ["router:8000"]
  - job_name: stable
    static_configs:
      - targets: ["stable:8000"]
  - job_name: canary
    static_configs:
      - targets: ["canary:8000"]
