apiVersion: v1
kind: Service
metadata:
  name: stable
  namespace: case-02
spec:
  selector:
    app.kubernetes.io/name: incident-service
    app.kubernetes.io/instance: stable
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stable
  namespace: case-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-service
      app.kubernetes.io/instance: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-service
        app.kubernetes.io/instance: stable
    spec:
      containers:
        - name: app
          image: case-02-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_RELEASE
              value: stable
            - name: APP_FAULT
              value: none
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: case-02-demo-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: postgresql://lab:$(POSTGRES_PASSWORD)@postgres:5432/incident_lab
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 750m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: canary
  namespace: case-02
spec:
  selector:
    app.kubernetes.io/name: incident-service
    app.kubernetes.io/instance: canary
  ports:
    - name: http
