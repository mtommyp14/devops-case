apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: case-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: router
    spec:
      containers:
        - name: router
          image: case-02-app:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.router:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: STABLE_URL
              value: http://stable:8000
            - name: CANARY_URL
              value: http://canary:8000
            - name: CANARY_PERCENT
              value: "5"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: case-02-demo-secrets
                  key: admin-token
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: case-02
spec:
  selector:
    app.kubernetes.io/name: router
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: case-02
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: router
        static_configs:
          - targets: ["router:8000"]
      - job_name: stable
        static_configs:
          - targets: ["stable:8000"]
      - job_name: canary
        static_configs:
          - targets: ["canary:8000"]
  alerts.yml: |
    groups:
      - name: incident-recovery
        rules:
          - alert: CanaryErrorRateHigh
            expr: (sum(rate(portfolio_requests_total{release="canary",status=~"5..",outcome="served"}[1m])) / clamp_min(sum(rate(portfolio_requests_total{release="canary",outcome="served"}[1m])), 0.001)) > 0.01
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Canary 5xx rate is above 1 percent
          - alert: CanaryP95LatencyHigh
            expr: histogram_quantile(0.95, sum by (le) (rate(portfolio_request_duration_seconds_bucket{release="canary"}[1m]))) > 1.2 * histogram_quantile(0.95, sum by (le) (rate(portfolio_request_duration_seconds_bucket{release="stable"}[1m])))
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Canary p95 is above 120 percent of stable p95
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: case-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1d
          ports:
            - name: web
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: case-02
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
