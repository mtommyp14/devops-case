apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load
  namespace: case-02
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6-load
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.56.0
          command: ["k6", "run", "/scripts/load.js"]
          env:
            - name: BASE_URL
              value: http://router:8000
            - name: RATE
              value: "40"
            - name: DURATION
              value: 130s
            - name: MAX_VUS
              value: "100"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: k6-script
