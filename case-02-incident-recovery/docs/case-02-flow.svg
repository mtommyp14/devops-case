<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Incident recovery: investigate, gate, and roll back</title>
  <desc id="desc">A load generator sends traffic through a proxy to stable and canary services. Metrics, logs, and traces feed a canary gate. Passing promotes in stages; failing rolls back to the stable image digest. A separate overload panel describes bounded load shedding.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17263d" flood-opacity=".08"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8593a6"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#d45c5b"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#16836f"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#17263d}
      .eyebrow{font-size:12px;font-weight:750;letter-spacing:1.8px;fill:#68788e}.title{font-size:30px;font-weight:760;letter-spacing:-.35px}.sub{font-size:14px;fill:#68788e}
      .section{font-size:13px;font-weight:780;letter-spacing:1px}.heading{font-size:15px;font-weight:740}.body{font-size:12px;fill:#66768b}.tiny{font-size:10px;fill:#75849a}.brand{font-size:10px;font-weight:800;letter-spacing:.3px}
      .line{fill:none;stroke:#8593a6;stroke-width:2.2;marker-end:url(#arrow)}.rline{fill:none;stroke:#d45c5b;stroke-width:2.5;marker-end:url(#red)}.gline{fill:none;stroke:#16836f;stroke-width:2.5;marker-end:url(#green)}
    </style>
  </defs>
  <rect width="1440" height="900" rx="22" fill="#f4f7fb"/><rect width="1440" height="122" rx="22" fill="#fff"/><path d="M0 122H1440" stroke="#e6ebf2"/>
  <text x="48" y="35" class="eyebrow">DEVOPS PORTFOLIO  /  CASE 02</text><text x="48" y="76" class="title">Catch a bad release before it spreads</text><text x="50" y="102" class="sub">Compare like-for-like traffic · stop on evidence · recover to a known digest</text>
  <rect x="1183" y="38" width="208" height="42" rx="13" fill="#eaf4f1"/><circle cx="1203" cy="59" r="6" fill="#16836f"/><text x="1217" y="63" class="tiny" style="font-weight:750;fill:#286a5c">LOCAL DOCKER LAB</text>

  <rect x="42" y="145" width="1356" height="475" rx="20" fill="#fff" stroke="#e0e7f0"/>
  <text x="68" y="180" class="section">01  ·  INVESTIGATE THE ROLLOUT</text><text x="68" y="202" class="body">Keep workload and comparison window consistent.</text>

  <rect x="70" y="265" width="190" height="112" rx="15" fill="#f5f8fd" stroke="#dce5f0"/>
  <circle cx="99" cy="295" r="14" fill="#e3edf9"/><path d="M91 295h16m-6-6 6 6-6 6" fill="none" stroke="#4779bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="122" y="300" class="heading">k6 workload</text><text x="90" y="334" class="body">steady requests</text><text x="90" y="356" class="tiny">throughput · p95/p99 · errors</text>

  <rect x="340" y="265" width="190" height="112" rx="15" fill="#f5f8fd" stroke="#dce5f0"/>
  <rect x="360" y="282" width="32" height="22" rx="6" fill="#416b9c"/><text x="376" y="297" text-anchor="middle" class="brand" style="fill:#fff">PX</text><text x="402" y="298" class="brand" style="fill:#416b9c">PROXY</text>
  <text x="360" y="334" class="heading">Traffic split</text><text x="360" y="356" class="body">stable + canary 5%</text>

  <rect x="620" y="190" width="210" height="104" rx="15" fill="#f4f8ff" stroke="#cfddf0"/>
  <text x="642" y="221" class="brand" style="fill:#416b9c">STABLE · LAST KNOWN GOOD</text><text x="642" y="254" class="heading">Stable service</text><text x="642" y="276" class="body">reference latency + errors</text>
  <rect x="620" y="345" width="210" height="104" rx="15" fill="#fff6f5" stroke="#f0d8d5"/>
  <text x="642" y="376" class="brand" style="fill:#b34a48">CANARY RELEASE</text><text x="642" y="409" class="heading">New service · 5%</text><text x="642" y="431" class="body">fault toggle for demo</text>

  <rect x="900" y="255" width="205" height="132" rx="15" fill="#f4f8ff" stroke="#cfddf0"/>
  <text x="922" y="289" class="heading">Evidence</text><text x="922" y="319" class="body">metrics + structured logs</text><text x="922" y="342" class="body">traces + dependency health</text><text x="922" y="368" class="tiny">compare matching windows</text>
  <rect x="1180" y="255" width="190" height="132" rx="15" fill="#fff" stroke="#dce5f0" filter="url(#shadow)"/>
  <text x="1202" y="289" class="heading">Canary gate</text><text x="1202" y="319" class="body">≥ 1,000 requests</text><text x="1202" y="342" class="body">2 × 1 min windows</text><text x="1202" y="368" class="tiny">p95 + 5xx vs stable</text>

  <path d="M260 321h80" class="line"/>
  <path d="M530 321h50v-79h40" class="line"/><path d="M580 321v76h40" class="line"/><circle cx="580" cy="321" r="4" fill="#8593a6"/>
  <path d="M830 242h38v54h32" class="line"/><path d="M830 397h38v-54h32" class="line"/>
  <path d="M1105 321h75" class="line"/>

  <rect x="915" y="485" width="245" height="92" rx="15" fill="#eff9f6" stroke="#cde8df"/>
  <text x="937" y="518" class="brand" style="fill:#16765f">PASS · PROMOTE</text><text x="937" y="546" class="heading">5% → 25% → 50% → 100%</text><text x="937" y="565" class="tiny">pause and observe at every step</text>
  <rect x="1200" y="485" width="170" height="92" rx="15" fill="#fde9e7" stroke="#e8bdb8"/>
  <text x="1222" y="518" class="brand" style="fill:#b34a48">FAIL · ROLLBACK</text><text x="1222" y="546" class="heading">Route to stable</text><text x="1222" y="565" class="tiny">keep stable release serving</text>
  <path d="M1275 387v46h-238v52" class="gline"/><path d="M1275 433v52" class="rline"/>
  <text x="1080" y="423" class="tiny" style="fill:#16765f">all gates pass</text><text x="1289" y="461" class="tiny" style="fill:#b34a48">regression</text>

  <rect x="42" y="650" width="1356" height="208" rx="20" fill="#17283e"/>
  <text x="68" y="690" class="section" style="fill:#edf3fa">02  ·  SHED LOAD SAFELY DURING OVERLOAD</text><text x="68" y="716" class="body" style="fill:#b7c5d7">Bound work before queues grow without limit; keep critical requests available.</text>
  <rect x="70" y="750" width="290" height="78" rx="13" fill="#233951"/><text x="90" y="781" class="heading" style="fill:#f5f8fc">Concurrency + queue caps</text><text x="90" y="806" class="tiny" style="fill:#b7c5d7">timeouts · bounded retries · circuit breaker</text>
  <path d="M360 789h80" fill="none" stroke="#8297b2" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="440" y="750" width="290" height="78" rx="13" fill="#233951"/><text x="460" y="781" class="heading" style="fill:#f5f8fc">Protect critical endpoints</text><text x="460" y="806" class="tiny" style="fill:#b7c5d7">reserve capacity for high-priority work</text>
  <path d="M730 789h80" fill="none" stroke="#8297b2" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="810" y="750" width="558" height="78" rx="13" fill="#233951"/><text x="832" y="781" class="heading" style="fill:#f5f8fc">Return an explicit back-pressure response</text><text x="832" y="806" class="tiny" style="fill:#b7c5d7">429/503 + Retry-After · report shed requests separately from 5xx</text>
</svg>
