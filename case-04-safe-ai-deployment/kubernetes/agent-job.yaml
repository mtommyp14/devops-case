apiVersion: batch/v1
kind: Job
metadata:
  name: proposal-agent
  namespace: case-04
  labels:
    app.kubernetes.io/role: agent
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/role: agent
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: case-04-app:local
          imagePullPolicy: IfNotPresent
          command: ["python", "agent.py"]
          env:
            - name: SCENARIO
              value: safe
            - name: PLAN_FILE
              value: /out/plan.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: plan-data
              mountPath: /out
            - name: scenarios
              mountPath: /scenarios
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: plan-data
          persistentVolumeClaim:
            claimName: plan-data
        - name: scenarios
          configMap:
            name: case-04-scenarios
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
